services:
  - type: web
    name: worker-profile-form
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MANAGER_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
